# CI Tethered (docs/DEVELOPMENT.md, раздел CI).
#
# Когда запускается: push в main, pull request, ручной запуск. Push в
# рабочую ветку CI не будит — для неё есть PR (раньше каждая правка в ветке
# с открытым PR гоняла всё дважды). Правки только документации CI не будят.
# Внутри — по частям: клиент, сервер и APK проверяются, только если менялись.
name: Fork CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Версия Flutter для всех сборок.
  FLUTTER_VERSION: 3.47.6

jobs:
  changes:
    name: что менялось
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.f.outputs.client }}
      server: ${{ steps.f.outputs.server }}
    steps:
      - uses: actions/checkout@v4
      - id: f
        uses: dorny/paths-filter@v3
        with:
          filters: |
            client:
              - 'lib/**'
              - 'test/**'
              - 'integration_test/**'
              - 'assets/**'
              - 'android/**'
              - 'ios/**'
              - 'env/**'
              - 'tool/**'
              - 'third_party/**'
              - 'pubspec.*'
              - 'analysis_options.yaml'
              - 'dart_test.yaml'
              - 'pocketbase/pb_public/**'
              - '.github/workflows/fork-ci.yml'
            server:
              - 'server/**'
              - 'pocketbase/pb_public/**'
              # Источник копии server/internal/migrations/schema (go generate).
              - 'pocketbase/collections_schema.json'
              - 'deploy/**'
              # Входы образа сервера: после зелёной серверной части его
              # публикует fork-server-image.yml.
              - '.dockerignore'
              - '.github/workflows/fork-server-image.yml'
              - '.github/workflows/fork-ci.yml'

  check:
    name: analyze + test
    needs: changes
    # Живой E2E-тест клиента ходит в сервер — правки сервера его тоже будят.
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.client == 'true' || needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Golden-тесты апстрима грузят шрифт иконок по пути snap-установки
      # Flutter у автора ($HOME/snap/flutter/common/flutter/...). Без него
      # иконки рисуются квадратами и 4 снимка расходятся. Симлинк вместо
      # правки чужих тестов.
      - name: путь к Flutter для golden-тестов
        run: |
          mkdir -p "$HOME/snap/flutter/common"
          ln -sfn "$(dirname "$(dirname "$(command -v flutter)")")" "$HOME/snap/flutter/common/flutter"

      # Роуты клиента есть на сервере, убранные зависимости не вернулись,
      # хуки и статика собираются (tool/fork/repo_check.py).
      - name: подписи кнопок
        run: |
          python3 tool/fork/icon_tooltips_test.py
          python3 tool/fork/icon_tooltips.py
          python3 tool/fork/coverage_summary_test.py

      - name: проверки репозитория
        run: python3 tool/fork/repo_check.py

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: browser room security and queue
        run: node --test test/fork/watch/*.test.cjs

      - name: dart format
        run: dart format --set-exit-if-changed -o none lib test

      # Ошибки фатальны всегда. Предупреждения апстрима записаны в
      # tool/fork/analyze_baseline.txt, новые валят проверку.
      - name: flutter analyze
        run: tool/fork/analyze_check.sh

      # env/test.json повторяет адреса апстрима: унаследованные тесты сверяют
      # их буквально. Поведение то же, что у сборки форка. Оба прогона пишут
      # покрытие (CI-3 аудита 29.10) — своим файлом, сводка склеит.
      - name: flutter test
        run: >-
          flutter test --dart-define-from-file=env/test.json --exclude-tags fork-runtime
          --coverage --coverage-path coverage/lcov.info

      # Сборка форка без env/test.json — адреса и ключи как в настоящей.
      - name: flutter test (сборка форка)
        run: >-
          flutter test test/fork --tags fork-runtime
          --coverage --coverage-path coverage/fork-runtime.info

      # Только отчёт, без порога: базовый процент сначала надо увидеть.
      - name: покрытие Dart
        run: >-
          python3 tool/fork/coverage_summary.py coverage/lcov.info coverage/fork-runtime.info
          >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: dart-coverage
          path: coverage/*.info
          if-no-files-found: ignore
          retention-days: 14

      # Обмен ключами E2E клиента против настоящего сервера: смоук заводит
      # пару, live_test — две установки с общим ключом пары и сверкой эмодзи.
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: E2E клиента против сервера
        run: >-
          SMOKE_AFTER='flutter test test/fork/e2e/live_test.dart --tags fork-live'
          server/scripts/smoke.sh

  server:
    name: server (Go)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      # go generate (жанры фильмов) и регрессы автора — на Python.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        run: go vet ./...

      # Копия схемы апстрима в модуле должна совпадать с оригиналом.
      - name: go generate без расхождений
        run: |
          go generate ./...
          git diff --exit-code -- .

      - name: go test
        run: go test -race -p 2 -timeout 20m ./...

      # Статика из pb_public апстрима: без адресов и аналитики автора.
      - name: статика
        run: sh scripts/sync-public.sh "$RUNNER_TEMP/pb_public"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: realtime broker security
        run: scripts/realtime-broker-check.sh

      - name: group identity guards (real server)
        run: SMOKE_AFTER='python3 "$PWD/scripts/group-authorship.test.py"' scripts/smoke.sh

      - name: groups guard — partner cannot act for you (real server)
        run: SMOKE_AFTER='python3 "$PWD/scripts/group-guard.test.py"' scripts/smoke.sh

      - name: realtime token expiry and membership (real server)
        env:
          TETHERED_CENTRIFUGO__API: http://127.0.0.1:9/api
          TETHERED_CENTRIFUGO__API_KEY: ci-test-key
        run: SMOKE_AFTER='python3 "$PWD/scripts/realtime-security.test.py"' scripts/smoke.sh

      # Настоящий бинарник: вход, пара по коду, чат.
      - name: смоук
        run: scripts/smoke.sh

      # Тесты автора (хуки и живые регрессы инвайтов) против нашего сервера.
      - name: паритет с апстримом
        run: |
          python -m pip install --quiet websockets cryptography
          scripts/parity.sh

  # integration_test/ на настоящем Android: кодеки и мосты плагинов, которых
  # в flutter test нет (сейчас — ужатие снимка для виджета). Сервер тестам не
  # нужен. Только на PR: на push в main эмулятор не гоняем — PR его уже
  # прошёл, а осечка эмулятора на main провалила бы Fork CI и задержала образ
  # сервера (fork-server-image.yml ждёт зелёный прогон).
  device:
    name: integration_test (эмулятор Android)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Эмулятору нужен KVM: на ubuntu-latest он есть, но закрыт правами.
      - name: доступ к KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: flutter test integration_test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: >-
            flutter test integration_test -d emulator-5554
            --dart-define-from-file=env/example.json

  apk:
    name: build APK
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Release-сборка ловит то, чего нет в debug (R8, shrinkResources).
      # Без key.properties Gradle подписывает её debug-ключом — для проверки
      # этого достаточно, боевой ключ живёт вне репозитория.
      - name: flutter build apk
        run: >-
          flutter build apk --release --target-platform android-arm64
          --no-tree-shake-icons --dart-define-from-file=env/example.json

      - name: проверка идентичности APK
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          badging=$("$aapt2" dump badging "$apk")
          grep -q "package: name='io.github.m0nstrum.tethered'" <<< "$badging"
          grep -q "application-label:'Tethered'" <<< "$badging"
          # Хост App Links пришёл из env/example.json, хостов апстрима нет.
          manifest=$("$aapt2" dump xmltree --file AndroidManifest.xml "$apk")
          grep -q '"pb.example.org"' <<< "$manifest"
          # here-string, а не `echo | grep -q`: под pipefail ранний выход grep
          # роняет echo по SIGPIPE. `! cmd` под set -e не валит шаг — явный exit.
          if grep -qE 'togetherly\.(day|duckdns)|web\.app|appmetrica|gms\.ads|TransportBackendDiscovery|SignInHubActivity' <<< "$manifest"; then
            echo "в манифесте остались хосты апстрима или реклама" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tethered-arm64-release-debugsigned
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
