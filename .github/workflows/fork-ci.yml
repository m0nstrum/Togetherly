# CI форка Tethered (docs/fork/PLAN.md, S0).
#
# Воркфлоу апстрима не трогаем: так они не конфликтуют при мёржах. Те, что
# форку не нужны (iOS, релизы в сторы), выключаются в настройках Actions
# репозитория — см. docs/fork/README.md.
name: Fork CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Та же версия, что в release-apk.yml апстрима.
  FLUTTER_VERSION: 3.47.6

jobs:
  check:
    name: analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Golden-тесты апстрима грузят шрифт иконок по пути snap-установки
      # Flutter у автора ($HOME/snap/flutter/common/flutter/...). Без него
      # иконки рисуются квадратами и 4 снимка расходятся. Симлинк вместо
      # правки чужих тестов.
      - name: путь к Flutter для golden-тестов
        run: |
          mkdir -p "$HOME/snap/flutter/common"
          ln -sfn "$(dirname "$(dirname "$(command -v flutter)")")" "$HOME/snap/flutter/common/flutter"

      # Правки форка на месте, роуты клиента есть на сервере, состав
      # апстрима разобран (docs/fork/MERGE.md).
      - name: подписи кнопок
        run: |
          python3 tool/fork/icon_tooltips_test.py
          python3 tool/fork/icon_tooltips.py

      - name: проверки мёржа
        run: python3 tool/fork/merge_check.py

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: browser room security and queue
        run: node --test test/fork/watch/*.test.cjs

      # Ошибки фатальны всегда. Предупреждения апстрима записаны в
      # tool/fork/analyze_baseline.txt, новые валят проверку.
      - name: flutter analyze
        run: tool/fork/analyze_check.sh

      # env/test.json повторяет адреса и платное поведение апстрима: его тесты
      # проверяют их буквально. Логику форка проверяют test/fork/*.
      - name: flutter test
        run: flutter test --dart-define-from-file=env/test.json --exclude-tags fork-runtime

      # Поведение сборки форка (всё бесплатно, без рекламы и каналов автора) —
      # без env/test.json, как в настоящей сборке.
      - name: flutter test (сборка форка)
        run: flutter test test/fork --tags fork-runtime

      # Обмен ключами E2E клиента против настоящего сервера: смоук заводит
      # пару, live_test — две установки с общим ключом пары и сверкой эмодзи.
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: E2E клиента против сервера
        run: >-
          SMOKE_AFTER='flutter test test/fork/e2e/live_test.dart --tags fork-live'
          server/scripts/smoke.sh

  server:
    name: server (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      # go generate (жанры фильмов) и регрессы автора — на Python.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        run: go vet ./...

      # Копия схемы апстрима в модуле должна совпадать с оригиналом.
      - name: go generate без расхождений
        run: |
          go generate ./...
          git diff --exit-code -- .

      - name: go test
        run: go test -race ./...

      # Статика из pb_public апстрима: без адресов и аналитики автора.
      - name: статика
        run: sh scripts/sync-public.sh "$RUNNER_TEMP/pb_public"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: realtime broker security
        run: scripts/realtime-broker-check.sh

      - name: group identity guards (real JS hooks)
        run: SMOKE_AFTER='python3 "$PWD/scripts/group-authorship.test.py"' scripts/smoke.sh

      - name: realtime token expiry and membership (real JS hooks)
        env:
          TETHERED_CENTRIFUGO__API: http://127.0.0.1:9/api
          TETHERED_CENTRIFUGO__API_KEY: ci-test-key
        run: SMOKE_AFTER='python3 "$PWD/scripts/realtime-security.test.py"' scripts/smoke.sh

      # Настоящий бинарник с JS-хуками апстрима: вход, пара по коду, чат.
      - name: смоук
        run: scripts/smoke.sh

      # Тесты автора (хуки и живые регрессы инвайтов) против нашего сервера.
      - name: паритет с апстримом
        run: |
          python -m pip install --quiet websockets cryptography
          scripts/parity.sh

  apk:
    name: build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Release-сборка ловит то, чего нет в debug (R8, shrinkResources).
      # Без key.properties Gradle подписывает её debug-ключом — для проверки
      # этого достаточно, боевой ключ живёт вне репозитория.
      - name: flutter build apk
        run: >-
          flutter build apk --release --target-platform android-arm64
          --no-tree-shake-icons --dart-define-from-file=env/example.json

      - name: проверка идентичности APK
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          badging=$("$aapt2" dump badging "$apk")
          grep -q "package: name='io.github.m0nstrum.tethered'" <<< "$badging"
          grep -q "application-label:'Tethered'" <<< "$badging"
          # Хост App Links пришёл из env/example.json, хостов апстрима нет.
          manifest=$("$aapt2" dump xmltree --file AndroidManifest.xml "$apk")
          grep -q '"pb.example.org"' <<< "$manifest"
          # here-string, а не `echo | grep -q`: под pipefail ранний выход grep
          # роняет echo по SIGPIPE. `! cmd` под set -e не валит шаг — явный exit.
          if grep -qE 'togetherly\.(day|duckdns)|web\.app|appmetrica|gms\.ads|TransportBackendDiscovery|SignInHubActivity' <<< "$manifest"; then
            echo "в манифесте остались хосты апстрима или реклама" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tethered-arm64-release-debugsigned
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
