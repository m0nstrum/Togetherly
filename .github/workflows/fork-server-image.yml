# Образ сервера в GHCR (deploy/README.md): VPS только скачивает готовый образ
# и не собирает Go сам — серверу хватает памяти на работу, а не на сборку.
#
# Теги: `latest`, `main` и `sha-<коммит>`. Только из main; образ рабочей ветки —
# ручным запуском (workflow_dispatch) на этой ветке.
name: Fork server image

on:
  # Образ публикуется только из main; PR проверяет сервер в Fork CI.
  push:
    branches: [main]
    paths:
      - server/**
      - pocketbase/pb_hooks/**
      - pocketbase/pb_public/**
      - .dockerignore
      - .github/workflows/fork-server-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-server-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: build + push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Эмуляция нужна только финальному слою (apk add под arm64): Go
      # собирается кросс-компиляцией.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tethered-server
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
