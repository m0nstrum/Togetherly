# Образ сервера в GHCR (deploy/README.md): VPS только скачивает готовый образ
# и не собирает Go сам — серверу хватает памяти на работу, а не на сборку.
#
# Публикуется только то, что прошло тесты: после зелёного Fork CI на main
# (workflow_run), и только если в этом прогоне отработала серверная часть
# (`server (Go)`). Fork CI фильтрует пути: на правках одного клиента серверная
# часть пропущена, сервер с прошлого образа не менялся — новый образ не нужен.
# Если же прошлый серверный коммит упал или его прогон отменили, следующий
# «клиентский» прогон не выпустит непроверенный сервер. Догнать такой коммит —
# ручной Fork CI на main (Run workflow): он гоняет все части.
#
# Теги: `sha-<коммит>` (7 знаков, ими закрепляют версию в deploy/.env),
# `latest` и `main` — только если в main после этого коммита нет более
# свежих правок сервера (прогоны могут закончиться не по порядку).
# Ручной запуск (workflow_dispatch) — образ рабочей ветки без тестов:
# `sha-<коммит>` и имя ветки, `latest` не трогает.
name: Fork server image

on:
  workflow_run:
    workflows: [Fork CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # Чтение задач прогона Fork CI: была ли серверная часть.
  actions: read

concurrency:
  group: fork-server-image-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

env:
  # Что попадает в образ (server/Dockerfile, .dockerignore).
  IMAGE_PATHS: server pocketbase/pb_public .dockerignore

jobs:
  image:
    name: build + push
    # PR в Fork CI тоже бывают из ветки main форка — их отсекает event.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'push' ||
        github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: серверная часть Fork CI прошла
        id: gate
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          server=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" \
            --jq '[.jobs[] | select(.name == "server (Go)") | .conclusion][0] // "absent"')
          echo "server (Go): $server"
          if [ "$server" = success ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Сервер в этом прогоне не проверялся ($server) — образ не публикуется"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      # workflow_run выполняется на коде main, а собрать надо проверенный коммит.
      - uses: actions/checkout@v4
        if: steps.gate.outputs.build != 'false'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # История — для сверки «нет ли в main правок сервера свежее».
          fetch-depth: 0

      - name: теги
        id: tags
        if: steps.gate.outputs.build != 'false'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/tethered-server
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          tags="$IMAGE:sha-${sha:0:7}"
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            git fetch --quiet origin main
            # shellcheck disable=SC2086 # IMAGE_PATHS — список путей
            newer=$(git log --format=%h "$sha..origin/main" -- $IMAGE_PATHS)
            if [ -z "$newer" ]; then
              tags="$tags,$IMAGE:latest,$IMAGE:main"
            else
              echo "::notice::В main есть правки сервера свежее ($newer) — latest не двигаем"
            fi
          elif [ "$BRANCH" != main ]; then
            tags="$tags,$IMAGE:$(echo "$BRANCH" | tr -c 'A-Za-z0-9_.\n-' '-')"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "$tags" | tr , '\n'

      # Эмуляция нужна только финальному слою (apk add под arm64): Go
      # собирается кросс-компиляцией.
      - uses: docker/setup-qemu-action@v3
        if: steps.gate.outputs.build != 'false'
      - uses: docker/setup-buildx-action@v3
        if: steps.gate.outputs.build != 'false'

      - uses: docker/login-action@v3
        if: steps.gate.outputs.build != 'false'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v6
        if: steps.gate.outputs.build != 'false'
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.tags.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
