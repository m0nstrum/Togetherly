name: Android → вырезка звука на эмуляторе

# Зачем: кусок песни к воспоминанию и подарку режет натив (SoundClipper.kt) —
# MediaExtractor, MediaCodec, MediaMuxer. Компиляция ошибок разбора не ловит, а
# эмулятор на ноутбуке не запускаем. Здесь тест гоняется на эмуляторе GitHub:
# образцы mp3, m4a и wav режутся по-настоящему.
on:
  # Только main и PR: push в рабочую ветку проверяет её PR.
  push:
    branches: [main]
    paths:
      - 'android/app/src/main/kotlin/com/togetherly/love/SoundClipper.kt'
      - 'android/app/src/androidTest/**'
      - '.github/workflows/android-sound-clip.yml'
  pull_request:
    paths:
      - 'android/app/src/main/kotlin/com/togetherly/love/SoundClipper.kt'
      - 'android/app/src/androidTest/**'
      - '.github/workflows/android-sound-clip.yml'
  workflow_dispatch:

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-soundclip-${{ hashFiles('pubspec.lock', 'android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-soundclip-
            ${{ runner.os }}-kotlincheck-

      - name: google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Зависимости и Gradle-проект
        run: |
          flutter pub get
          flutter build apk --config-only --debug

      # Эмулятору нужен KVM: на раннерах GitHub он есть, но закрыт правами
      - name: Доступ к KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Тест вырезки на эмуляторе
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: android
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.togetherly.love.SoundClipperTest --no-daemon --stacktrace

      - name: Отчёт теста
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sound-clip-report
          path: build/app/reports/androidTests/
          if-no-files-found: ignore
